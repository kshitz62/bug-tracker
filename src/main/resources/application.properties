# Server Configuration
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bugtracker_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:bugtracker}
spring.datasource.password=${DB_PASSWORD:BugTracker@2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Batch lazy collection loading to avoid N+1 selects on the bug list
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# Lazy loading outside a transaction is never relied upon
spring.jpa.open-in-view=false

# Static frontend assets are served directly from the repository's frontend folder
spring.web.resources.static-locations=classpath:/static/,file:./frontend/
spring.mvc.static-path-pattern=/**
spring.web.resources.add-mappings=true

# File Multipart Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# JWT Secret & Expiration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Upload directory (bound to AppProperties.uploadDir — keep the kebab-case key)
app.upload-dir=${UPLOAD_DIR:./uploads}

# Seed demo data flag
app.seed-data=${APP_SEED_DATA:true}

# Logging
logging.level.com.bugtracker=INFO
logging.level.org.springframework.security=WARN
